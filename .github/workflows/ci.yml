name: KOPPKAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chatgpt/backend-monthly-dues]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koppkas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function typecheck
        run: deno check supabase/functions/account-admin/index.ts
      - name: Schema invariant tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build

  database-migrations:
    name: Supabase migration chain (local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start isolated local Supabase services
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - name: Rebuild local database from repository migrations
        run: supabase db reset --local --no-seed
      - name: Run database authorization and integrity tests
        run: supabase test db
      - name: Install PostgreSQL client for concurrency smoke test
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify concurrent lifecycle sync and ambiguous payment retry
        run: bash scripts/monthly-dues-concurrency-smoke.sh
