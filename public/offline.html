<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5fbff">
  <title>KOPPKAS — Offline</title>
  <style>
    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;background:#f5fbff;color:#18364b}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,460px);border:1px solid #dbe8f0;background:#fff;padding:32px;border-radius:18px}
    .mark{font-size:12px;font-weight:800;letter-spacing:.18em;color:#3c82b3}
    h1{font-size:30px;line-height:1.12;margin:20px 0 12px}
    p{font-size:15px;line-height:1.7;color:#587184;margin:0}
    .note{margin-top:22px;padding-top:18px;border-top:1px solid #e5eef4;font-size:12px}
    button{margin-top:24px;border:0;border-radius:9px;background:#176b9b;color:white;padding:12px 18px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark">PEMUDA KAMPUNG SAWAH KAUM</div>
    <h1>Koneksi sedang terputus.</h1>
    <p>KOPPKAS belum dapat terhubung ke server. Periksa jaringan lalu coba lagi.</p>
    <p class="note">Demi keamanan, data anggota, keuangan, dokumen pribadi, dan perubahan persetujuan tidak disimpan untuk akses offline.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
